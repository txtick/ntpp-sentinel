services:
  sentinel:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ntpp-sentinel
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./data:/data
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  ingest-worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ntpp-ingest-worker
    restart: unless-stopped
    env_file: .env
    command: ["/app/ingest/worker-start.sh"]
    expose:
      - "8010"
    volumes:
      - ./data:/data
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  web-backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ntpp-web-backend
    restart: unless-stopped
    env_file: .env
    command: ["/app/web_backend_start.sh"]
    expose:
      - "8020"
    volumes:
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    container_name: ntpp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
