<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTPP Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <p class="eyebrow">North Texas Pool Pros</p>
          <h1>Sentinel Dashboard</h1>
          <p class="subtitle">
            Operational workflow for alerts, technicians, customers, labor, and
            follow-up work.
          </p>
        </div>

        <nav class="nav" aria-label="Primary">
          <button class="nav-link is-active" data-view="home">Home</button>
          <button class="nav-link" data-view="alerts">Alerts</button>
          <button class="nav-link" data-view="customers">Customers</button>
          <button class="nav-link" data-view="problem-pools">
            Problem Pools
          </button>
          <button class="nav-link" data-view="technicians">Technicians</button>
          <button class="nav-link" data-view="labor">Labor</button>
          <button class="nav-link" data-view="reminders">Reminders</button>
          <button class="nav-link" data-view="settings">Settings</button>
          <div class="nav-section-label">Routes</div>
          <button class="nav-link nav-sub" data-view="route-sandbox">
            Route Sandbox
          </button>
          <button class="nav-link nav-sub" data-view="route-tech-settings">
            Tech Settings
          </button>
        </nav>

        <section class="auth-card" id="session-card">
          <h2>Dashboard Access</h2>
          <p id="session-summary" class="muted">Checking sign-in…</p>
          <a
            id="login-button"
            class="button button-primary"
            href="/auth/google/start"
            >Sign In with Google</a
          >
          <button id="logout-button" class="button button-secondary" hidden>
            Sign Out
          </button>
        </section>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div>
            <p id="view-kicker" class="eyebrow">Home</p>
            <h2 id="view-title">Dashboard Overview</h2>
          </div>
          <div class="header-actions">
            <span id="status-pill" class="pill pill-info">Ready</span>
            <button id="refresh-view" class="button button-secondary">
              Refresh View
            </button>
          </div>
        </header>

        <section id="view-filters" class="filters"></section>

        <section class="content-grid">
          <section id="main-panel" class="panel panel-main">
            <div class="empty-state">Loading…</div>
          </section>
          <aside id="detail-panel" class="panel panel-detail">
            <div class="empty-state">Select an item to inspect details.</div>
          </aside>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPeE="
      crossorigin=""
    ></script>
    <script src="/app.js"></script>
  </body>
</html>
